# Pylon provides chain interaction (metagraph, weights, commitments).
# Note for Mac (Apple Silicon) users: Pylon has no ARM64 build.
# Run with: DOCKER_DEFAULT_PLATFORM=linux/amd64 docker compose up -d

services:
  pylon:
    # Pinned RESI build: upstream service-v2.3.0 plus two fixes — TypeError added
    # to RECONNECT_EXCEPTIONS so a poisoned turbobt client self-recovers (the
    # 2026-07-27/28 weight-setting outages), and turbobt pinned to a patched fork
    # that accepts str subscription ids from post-spec-440 nodes (turbobt 1.3.0
    # crashed AFTER a successful submit, so Pylon retry-spammed every weight-set
    # until the task expired). Drop back to the upstream image once their release
    # includes both fixes (PRs: resi-labs-ai/bittensor-pylon#1,
    # bittensor-church/turbobt#31).
    image: ghcr.io/resi-labs-ai/bittensor-pylon:2.3.0-resi.2@sha256:e3fb4ed00bb84fa9e3d7556d3fd79a5c1a4236fba5fd9b4ea9b13ebe26729abf
    container_name: resi_pylon
    command: >
      pylon_service/.venv/bin/python -m uvicorn pylon_service.main:app
      --host 0.0.0.0 --port 8000
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - PYLON_BITTENSOR_NETWORK=${SUBTENSOR_NETWORK:-finney}
      - PYLON_BITTENSOR_WALLET_PATH=/root/.bittensor/wallets
      - PYLON_IDENTITIES=${PYLON_IDENTITIES:-["validator"]}
      - PYLON_ID_VALIDATOR_NETUID=${NETUID:-46}
      - PYLON_ID_VALIDATOR_WALLET_NAME=${WALLET_NAME:-validator}
      - PYLON_ID_VALIDATOR_HOTKEY_NAME=${WALLET_HOTKEY:-default}
      - PYLON_ID_VALIDATOR_TOKEN=${PYLON_TOKEN}
      - PYLON_TEMPO=${PYLON_TEMPO:-360}
      - PYLON_BITTENSOR_ARCHIVE_NETWORK=${ARCHIVE_NETWORK:-archive}
      - PYLON_BITTENSOR_ARCHIVE_BLOCKS_CUTOFF=${ARCHIVE_BLOCKS_CUTOFF:-256}
    volumes:
      - ${BITTENSOR_WALLET_PATH:-~/.bittensor/wallets}:/root/.bittensor/wallets:ro
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "10"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import socket; s=socket.socket(); s.connect(('localhost', 8000)); s.close()\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ONNX Runner image for model evaluation (build-only, not a running service)
  onnx-runner:
    build: ./real_estate/evaluation
    image: resi-onnx-runner:latest
    profiles: ["build"]
